<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduConnect Kenya — Forgot Password</title>
  <link rel="icon" type="favicon" href="Assets/imges/Gemini_Generated_Image_b741uvb741uvb741.png" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/nav.css" />
  <link rel="stylesheet" href="styles/auth.css" />
</head>
<body data-page="forgot-password">

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="label">EduConnect Kenya</span>
      <h1>Recover Your Password</h1>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    <form id="forgot-password-form" class="auth-form">
      <div class="input-group">
        <label for="reset-email">Email address</label>
        <input type="email" id="reset-email" name="email" placeholder="you@educonnect.or.ke" required />
      </div>
      <button type="submit" class="btn btn-primary">Send Reset Link</button>
      <p class="auth-link">
        Remember your password? <a href="login.html">Back to Sign In</a>
      </p>
    </form>

    <div id="reset-status" style="display: none; margin-top: 20px;">
      <p id="reset-message" style="padding: 16px; background: rgba(0,168,107,0.15); border: 1px solid rgba(0,168,107,0.3); border-radius: 16px; color: #00D68F;"></p>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2025 EduConnect Kenya. All rights reserved. 🇰🇪</p>
      <p>Empowering Learners · Strengthening Communities · Building Kenya's Future</p>
    </div>
  </div>
</footer>

<div class="toast-container"></div>

<script src="js/utils.js"></script>
<script>
const API_BASE = '/api';

async function handleForgotPassword(event) {
  event.preventDefault();
  const form = event.target;
  const email = form.email.value.trim();

  if (!email) {
    showToast('Please enter your email address.', 'error');
    return;
  }

  try {
    const response = await fetch(`${API_BASE}/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email })
    });

    const data = await response.json();
    
    if (response.ok) {
      document.getElementById('forgot-password-form').style.display = 'none';
      document.getElementById('reset-status').style.display = 'block';
      document.getElementById('reset-message').textContent = 
        `✅ ${data.message} Check your inbox for the reset link.`;
      showToast('Check your email for the reset link!', 'success');
    } else {
      showToast(data.message || 'Error requesting password reset.', 'error');
    }
  } catch (error) {
    showToast('Network error. Please try again.', 'error');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('forgot-password-form');
  if (form) {
    form.addEventListener('submit', handleForgotPassword);
  }
});
</script>
</body>
</html>

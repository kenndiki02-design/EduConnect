<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduConnect Kenya — Reset Password</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/nav.css" />
  <link rel="stylesheet" href="styles/auth.css" />
</head>
<body data-page="reset-password">

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <span class="label">EduConnect Kenya</span>
      <h1>Create New Password</h1>
      <p>Enter a strong password to secure your account.</p>
    </div>

    <form id="reset-password-form" class="auth-form">
      <div class="input-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" name="password" placeholder="Enter a strong password" required />
        <small style="color: var(--text-secondary); margin-top: 6px; display: block;">
          Password must be at least 6 characters long
        </small>
      </div>
      <div class="input-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm your password" required />
      </div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>

    <div id="reset-status" style="display: none; margin-top: 20px;">
      <p id="reset-message" style="padding: 16px; background: rgba(0,168,107,0.15); border: 1px solid rgba(0,168,107,0.3); border-radius: 16px; color: #00D68F;"></p>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2025 EduConnect Kenya. All rights reserved. 🇰🇪</p>
      <p>Empowering Learners · Strengthening Communities · Building Kenya's Future</p>
    </div>
  </div>
</footer>

<div class="toast-container"></div>

<script src="js/utils.js"></script>
<script>
const API_BASE = '/api';

function getUrlParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    token: params.get('token'),
    email: params.get('email')
  };
}

async function handleResetPassword(event) {
  event.preventDefault();
  const params = getUrlParams();

  if (!params.token || !params.email) {
    showToast('Invalid or missing reset token. Please request a new password reset.', 'error');
    setTimeout(() => window.location.href = 'forgot-password.html', 2000);
    return;
  }

  const password = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;

  if (!password || !confirmPassword) {
    showToast('Please fill in all fields.', 'error');
    return;
  }

  if (password.length < 6) {
    showToast('Password must be at least 6 characters long.', 'error');
    return;
  }

  if (password !== confirmPassword) {
    showToast('Passwords do not match.', 'error');
    return;
  }

  try {
    const response = await fetch(`${API_BASE}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        email: params.email,
        token: params.token,
        newPassword: password
      })
    });

    const data = await response.json();

    if (response.ok) {
      document.getElementById('reset-password-form').style.display = 'none';
      document.getElementById('reset-status').style.display = 'block';
      document.getElementById('reset-message').textContent = 
        '✅ ' + (data.message || 'Password reset successfully! Redirecting to login...');
      showToast('Password reset successful!', 'success');
      setTimeout(() => window.location.href = 'login.html', 3000);
    } else {
      showToast(data.message || 'Error resetting password.', 'error');
    }
  } catch (error) {
    showToast('Network error. Please try again.', 'error');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const params = getUrlParams();
  if (!params.token || !params.email) {
    document.getElementById('reset-password-form').innerHTML = 
      '<p style="color: var(--text-secondary);">Invalid reset link. Please request a new password reset.</p>';
    return;
  }

  const form = document.getElementById('reset-password-form');
  if (form) {
    form.addEventListener('submit', handleResetPassword);
  }
});
</script>
</body>
</html>
